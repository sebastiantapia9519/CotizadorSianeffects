{% extends "layout.html" %}

{% block title %}Pago Cancelado | Sianeffects{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm border" style="max-width: 500px;">
        
        <div class="mb-4 text-warning">
            <i class="fas fa-exclamation-circle" style="font-size: 5rem;"></i>
        </div>
        
        <h2 class="fw-bold text-dark mb-3">Transacción Incompleta</h2>
        <p class="text-muted mb-4">
            El proceso de pago fue cancelado. No te preocupes, <strong>no se ha realizado ningún cargo</strong> a tu tarjeta.
        </p>
        
        <div class="d-grid gap-3">
            <button class="btn btn-sian fw-bold py-3 rounded-pill shadow-sm" data-bs-toggle="modal" data-bs-target="#modalRenovacion">
                <i class="fas fa-redo-alt me-2"></i> Intentar nuevamente
            </button>
            
            <a href="{{ url_for('main.cotizador') }}" class="btn btn-outline-secondary fw-bold py-3 rounded-pill">
                <i class="fas fa-arrow-left me-2"></i> Volver al inicio
            </a>
        </div>
        
        <div class="mt-4 pt-3 border-top">
            <a href="https://wa.me/5218134939580?text=Hola,%20tuve%20un%20problema%20al%20intentar%20pagar%20mi%20suscripción." target="_blank" class="text-muted small text-decoration-none fw-bold">
                <i class="fab fa-whatsapp text-success me-1"></i> ¿Tuviste algún problema? Escríbenos.
            </a>
        </div>
    </div>
</div>
{% endblock %}
