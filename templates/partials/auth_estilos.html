{# Estilos compartidos de login y registro. Paleta y tipografía del logo del cotizador. #}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --rosa: #E2827E;
        --rosa-hover: #D46F6B;
        --rosa-suave: #F4A3A0;
        --rosa-fondo: #FDE3E1;
        --menta: #7CD1C4;
        --menta-texto: #2F8F80;
        --menta-fondo: #DDF4F0;
        --tinta: #3A3145;
        --gris: #756A80;
        --linea: #EFE3DE;
        --crema: #FFF8F3;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Nunito', system-ui, sans-serif;
        color: var(--tinta);
        background: var(--crema);
    }

    /* Dos columnas en escritorio: marca a la izquierda, formulario a la derecha */
    .auth {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }

    .auth-marca {
        position: relative;
        overflow: hidden;
        padding: 56px 64px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
            radial-gradient(circle at 85% 8%, var(--rosa-fondo) 0 180px, transparent 181px),
            radial-gradient(circle at 5% 100%, var(--menta-fondo) 0 220px, transparent 221px),
            var(--crema);
        border-right: 1px solid var(--linea);
    }

    .auth-marca .logo { height: 54px; width: auto; }

    .auth-marca h2 {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: clamp(2rem, 3.2vw, 2.9rem);
        line-height: 1.08;
        margin: 0 0 18px;
        max-width: 14ch;
    }

    .auth-marca h2 span { background: linear-gradient(transparent 60%, #FFE29A 60%); padding: 0 4px; }

    .auth-marca .beneficios { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 14px; }

    .auth-marca .beneficios li { display: flex; gap: 12px; align-items: flex-start; font-weight: 700; color: var(--gris); font-size: 1.05rem; }

    .auth-marca .beneficios i {
        flex: none; width: 28px; height: 28px; border-radius: 50%;
        background: var(--menta); color: #fff; font-size: .8rem;
        display: inline-flex; align-items: center; justify-content: center; margin-top: 1px;
    }

    .auth-marca .cita {
        display: flex; gap: 14px; align-items: center;
        background: #fff; border: 1px solid var(--linea); border-radius: 20px; padding: 16px 18px;
        max-width: 440px;
    }

    .auth-marca .cita p { margin: 0; font-weight: 700; font-size: .95rem; color: var(--tinta); }
    .auth-marca .cita small { display: block; margin-top: 4px; font-weight: 800; color: var(--gris); font-size: .8rem; }
    .auth-marca .cita .avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--rosa-fondo); display: flex; align-items: center; justify-content: center; color: var(--rosa); }

    /* Columna del formulario */
    .auth-form {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
    }

    .auth-card {
        width: 100%;
        max-width: 440px;
        background: #fff;
        border: 1px solid var(--linea);
        border-radius: 28px;
        padding: 40px 36px;
        box-shadow: 0 18px 40px rgba(58, 49, 69, .07);
    }

    .auth-card .logo-movil { display: none; height: 46px; width: auto; margin: 0 auto 22px; }

    .auth-card h1 {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 2rem;
        margin: 0 0 6px;
        color: var(--tinta);
    }

    .auth-card .sub { color: var(--gris); font-weight: 700; margin: 0 0 26px; }

    .etiqueta-trial {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--menta-fondo); color: var(--menta-texto);
        font-weight: 800; font-size: .85rem; border-radius: 50px; padding: 5px 14px; margin-bottom: 24px;
    }

    /* Campos */
    .form-floating > .form-control {
        border: 2px solid var(--linea);
        border-radius: 16px;
        font-weight: 600;
        color: var(--tinta);
    }

    .form-floating > label { color: var(--gris); font-weight: 600; }

    .form-control:focus {
        border-color: var(--rosa-suave);
        box-shadow: 0 0 0 .25rem rgba(226, 130, 126, .15);
    }

    .form-text { color: var(--gris); }

    .campo-clave { position: relative; }

    .campo-clave .form-control { padding-right: 52px; }

    .ver-clave {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        border: 0; background: transparent; color: #B9AEB8; font-size: 1.05rem;
        width: 40px; height: 40px; border-radius: 12px; z-index: 5;
    }

    .ver-clave:hover, .ver-clave[aria-pressed="true"] { color: var(--rosa); }
    .ver-clave:focus-visible { outline: 2px solid var(--rosa-suave); }

    /* Botones y links */
    .btn-sian {
        position: relative; overflow: hidden;
        background: var(--rosa); color: #fff; border: 0;
        border-radius: 50px; padding: 15px; width: 100%;
        font-weight: 800; font-size: 1.05rem;
        box-shadow: 0 8px 18px rgba(226, 130, 126, .3);
        transition: transform .2s ease, background-color .2s ease, box-shadow .2s ease;
    }

    .btn-sian:hover:not(:disabled) { background: var(--rosa-hover); color: #fff; transform: translateY(-2px); }
    .btn-sian:active:not(:disabled) { transform: translateY(0) scale(.985); }
    .btn-sian:focus-visible { outline: 3px solid rgba(226, 130, 126, .4); outline-offset: 3px; }
    .btn-sian:disabled { cursor: progress; opacity: .9; color: #fff; }

    .btn-sian::after {
        content: ''; position: absolute; top: 0; left: -80%; width: 45%; height: 100%;
        background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .38), transparent);
        transform: skewX(-20deg); pointer-events: none;
    }

    .btn-sian:hover:not(:disabled)::after { animation: sian-brillo .75s ease; }

    @keyframes sian-brillo { to { left: 135%; } }

    .btn-secundario {
        display: block; text-align: center; width: 100%;
        border: 2px solid var(--linea); border-radius: 50px; padding: 12px;
        color: var(--tinta); font-weight: 800; text-decoration: none; background: #fff;
        transition: border-color .2s ease, color .2s ease;
    }

    .btn-secundario:hover { border-color: var(--rosa-suave); color: var(--rosa); }

    .link-sian { color: var(--menta-texto); font-weight: 800; text-decoration: none; }
    .link-sian:hover { color: var(--rosa); }

    .separador { display: flex; align-items: center; gap: 12px; color: var(--gris); font-size: .85rem; font-weight: 700; margin: 24px 0 16px; }
    .separador::before, .separador::after { content: ''; flex: 1; height: 1px; background: var(--linea); }

    .form-check-input:checked { background-color: var(--rosa); border-color: var(--rosa); }
    .form-check-input:focus { box-shadow: 0 0 0 .25rem rgba(226, 130, 126, .15); border-color: var(--rosa-suave); }

    .alert { border: 0; border-radius: 16px; font-weight: 700; font-size: .92rem; background: var(--crema); color: var(--tinta); }
    .alert-error, .alert-danger { background: #FDE3E1; color: #A4433F; }
    .alert-success { background: var(--menta-fondo); color: var(--menta-texto); }
    .alert-warning { background: #FFF3D6; color: #8A5A10; }
    .alert-info { background: #EEF0FB; color: #44508A; }

    .pie-auth { text-align: center; margin-top: 22px; font-size: .9rem; color: var(--gris); }

    /* Celular: solo la tarjeta, con el logo arriba */
    @media (max-width: 900px) {
        .auth { grid-template-columns: 1fr; }
        .auth-marca { display: none; }
        .auth-form { padding: 28px 16px; align-items: flex-start; }
        .auth-card { padding: 32px 22px; border-radius: 24px; }
        .auth-card .logo-movil { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
        .btn-sian, .btn-sian::after { transition: none !important; animation: none !important; }
        .btn-sian:hover:not(:disabled) { transform: none; }
    }
</style>
