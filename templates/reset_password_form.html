<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva Contraseña | Sianeffects</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/iconSianeffects512x512.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --sian-pink: #ff6b81; --sian-pink-dark: #ff4765; --sian-bg: #ffeef0; }
        body { background-color: var(--sian-bg); font-family: 'Nunito', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card-reset { border: none; border-radius: 25px; box-shadow: 0 15px 35px rgba(255, 107, 129, 0.15); width: 100%; max-width: 420px; background: white; padding: 2.5rem; }
        .brand-pink { color: var(--sian-pink); font-weight: 900; font-size: 2rem; }
        .form-control { border-radius: 15px; padding: 12px 15px; border: 2px solid #f0f0f0; }
        .form-control:focus { border-color: var(--sian-pink); box-shadow: 0 0 0 0.25rem rgba(255, 107, 129, 0.1); }
        .btn-primary { background-color: var(--sian-pink); border: none; border-radius: 50px; padding: 14px; font-weight: 800; }
    </style>
</head>

<body>
    <div class="card card-reset">
        <div class="text-center mb-4">
            <h1 class="brand-pink mb-1">Sianeffects</h1>
            <h4 class="fw-bold text-dark">Nueva Contraseña</h4>
            <p class="text-muted small">Crea una clave segura para tu cuenta.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }} border-0 small text-center rounded-pill mb-3">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-floating mb-2">
                <input type="password" name="password" class="form-control" id="passInput" 
                       placeholder="Nueva Clave" minlength="6" required>
                <label for="passInput" class="text-muted">Nueva Contraseña</label>
            </div>
            <div class="form-text small mb-3 ms-2 text-muted">
                <i class="fas fa-info-circle"></i> Mínimo 6 caracteres.
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="confirm_password" class="form-control" id="confirmInput" 
                       placeholder="Confirmar" required>
                <label for="confirmInput" class="text-muted">Confirmar Contraseña</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow text-white">
                ACTUALIZAR CONTRASEÑA 🔒
            </button>
        </form>
    </div>
</body>
</html>
