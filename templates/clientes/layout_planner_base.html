<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Panel de Socio{% endblock %} | SianEffects</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/iconSianeffects512x512.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sian-pink: #ff6b81;
            --bg-cream: #fdfbf7;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            padding-top: 80px; /* Espacio para el navbar fijo */
        }
        .navbar-socio {
            background-color: #ffffff;
            border-bottom: 3px solid #fff0f3;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

    <nav class="navbar navbar-light bg-white shadow-sm fixed-top navbar-socio">
        <div class="container d-flex justify-content-between">
            <span class="navbar-brand fw-bold">
                <span style="color: var(--sian-pink);">🎨 Panel de Socios</span>
            </span>
            <div class="d-flex gap-2">
                <a href="{{ url_for('invitaciones_clientes.dashboard_planner') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-bold d-none d-md-block">
                    <i class="fas fa-home me-1"></i> Inicio
                </a>
                <a href="{{ url_for('invitaciones_clientes.logout_cliente') }}" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-bold">
                    <i class="fas fa-sign-out-alt me-1"></i> Salir
                </a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
