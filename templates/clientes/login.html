<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Mi Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background-color: #fdfbf7; /* Un tono cremita elegante */
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body>
    <div class="card p-5 shadow-lg border-0 rounded-4 text-center" style="max-width: 400px; width: 100%; background: white;">
        <div class="mb-4">
            <i class="fas fa-heart text-danger fa-2x mb-3"></i>
            <h3 class="text-dark fw-bold m-0">Mis Recuerdos</h3>
            <p class="text-muted small mt-2" style="font-family: sans-serif;">Ingresa el código único de tu evento para acceder al panel.</p>
        </div>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 small rounded-3" style="font-family: sans-serif;">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-4">
                <input type="text" name="codigo" class="form-control form-control-lg text-center fw-bold" 
                       placeholder="EJ: SIA-XXXXX" required 
                       style="letter-spacing: 2px; text-transform: uppercase; font-family: sans-serif;">
            </div>
            <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 shadow-sm" style="font-family: sans-serif;">
                Entrar al Panel <i class="fas fa-arrow-right ms-2"></i>
            </button>
        </form>
    </div>
</body>
</html>
