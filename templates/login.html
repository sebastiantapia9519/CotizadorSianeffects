<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Regístrate - SianEffects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #2ec4b6;
            /* Fondo verde azulado para diferenciar del login */
            font-family: 'Nunito', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-login {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }

        .card-header {
            background-color: white;
            border-bottom: none;
            padding-top: 30px;
            text-align: center;
        }

        .brand {
            color: #2ec4b6;
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .form-label {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #eee;
            background-color: #f9f9f9;
        }

        .form-control:focus {
            border-color: #2ec4b6;
            background-color: white;
            box-shadow: none;
        }

        .btn-success {
            background-color: #ff6b81 !important;
            /* Botón rosa para resaltar */
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 800;
            transition: transform 0.2s;
        }

        .btn-success:hover {
            background-color: #ff4765 !important;
            transform: translateY(-2px);
        }

        .form-check-input:checked {
            background-color: #2ec4b6;
            border-color: #2ec4b6;
        }
    </style>
</head>

<body>
    <div class="card card-login">
        <div class="card-header">
            <h1 class="brand">SianEffects</h1>
            <p class="text-muted small fw-bold">Crea tu cuenta gratis</p>
        </div>
        <div class="card-body p-4">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }} text-center small border-0 shadow-sm rounded-3">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post">
                <div class="mb-3">
                    <label class="form-label text-muted">Nombre Completo</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej. Sebastián Tapia" required>
                </div>

                <div class="mb-3">
                    <input type="text" name="email_or_user" class="form-control" placeholder="Correo o Usuario"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres"
                        required>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" name="terms" id="termsCheck" required>
                    <label class="form-check-label small text-muted" for="termsCheck">
                        Acepto los <a href="{{ url_for('main.terminos') }}" target="_blank"
                            class="text-decoration-none fw-bold" style="color: #2ec4b6">Términos y Condiciones</a> y el
                        uso de mis datos para el servicio.
                    </label>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success fw-bold py-3">
                        COMENZAR PRUEBA GRATIS 🚀
                    </button>

                    <a href="{{ url_for('auth.login') }}"
                        class="btn btn-light text-muted btn-sm mt-2 rounded-pill fw-bold">
                        ¿Ya tienes cuenta? Entrar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
