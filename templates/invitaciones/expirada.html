<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Concluido</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/iconSianeffects512x512.png') }}" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #fdfbf7;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Playfair Display', serif;
        }
        .card-expirada {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .icon-lock {
            font-size: 3rem;
            color: #D4AF37;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="card-expirada">
        <i class="fas fa-lock icon-lock"></i>
        <h2 class="mb-3" style="color: #333;">El evento ha concluido</h2>
        <p style="font-family: 'Arial', sans-serif; color: #777; line-height: 1.6;">
            Esta invitación ha sido archivada en nuestros servidores porque la fecha del evento y su periodo de visualización ya han terminado.
        </p>
        <hr style="opacity: 0.1; margin: 30px 0;">
        <small style="font-family: 'Arial', sans-serif; color: #aaa; text-transform: uppercase; letter-spacing: 1px;">
             Creado con ❤️ por Sianeffects
        </small>
    </div>
</body>
</html>
