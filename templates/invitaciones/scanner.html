<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Recepción - SianEffects</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        #reader { width: 100%; max-width: 500px; border-radius: 15px; overflow: hidden; border: 2px solid #333; }
        .info-panel { margin-top: 20px; text-align: center; }
        .logo-sian { font-weight: bold; letter-spacing: 2px; color: #D4AF37; margin-bottom: 10px; font-size: 1.5rem; }
        .badge-mode { font-size: 0.7rem; padding: 3px 10px; border-radius: 10px; margin-bottom: 20px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="logo-sian">SIANEFFECTS RECEPCIÓN</div>
    {% if inv %}
    <span class="badge-mode bg-primary">Modo Cliente</span>
    <h5 class="mb-4 text-secondary">Evento: {{ inv['slug'] }}</h5>
    {% else %}
    <span class="badge-mode bg-danger">Modo Administrador Maestro</span>
    <h5 class="mb-4 text-secondary">Validación Global de QR</h5>
    {% endif %}

    <div id="reader"></div>

    <div class="info-panel">
        <p id="status" class="text-muted">Apunte la cámara al código QR del invitado</p>
    </div>

    <script>
            // Si 'inv' existe, mandamos su ID, si no (Admin), mandamos null
            const invitacionId = {{ inv.id if inv else 'null' }};
        let isScanning = true;

        function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false; 

            // Enviamos el código al servidor
            fetch('/api/validar-qr', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    codigo: decodedText,
                    invitacion_id: invitacionId
                })
            })
            .then(res => res.json())
                .then(data => {
                if (data.success) {
                    Swal.fire({
                        title: '¡Acceso Garantizado! ✅',
                        html: `
                            <div style="text-align: left; font-size: 1.1rem;">
                                <p><b>Familia:</b> ${data.familia}</p>
                                <p><b>Pases:</b> ${data.pases}</p>
                                <p><b>Mesa:</b> <span style="color: #D4AF37; font-weight: bold;">${data.mesa}</span></p>
                                ${data.evento ? `<hr><p class="small text-muted">Evento: ${data.evento}</p>` : ''}
                                <hr>
                                <p style="color: #D4AF37; text-align: center;">¡Bienvenidos!</p>
                            </div>
                        `,
                        icon: 'success',
                        confirmButtonText: 'Siguiente invitado',
                        confirmButtonColor: '#D4AF37'
                    }).then(() => { isScanning = true; });
                } else {
                    Swal.fire({
                        title: 'Acceso Denegado',
                        text: data.error,
                        icon: 'error',
                        confirmButtonColor: '#d33'
                    })
                    .then(() => { isScanning = true; });
                }
            })
            .catch(err => {
                console.error(err);
                Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
                isScanning = true;
            });
        }

            function onScanFailure(error) { /* Silencioso */ }

            let html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                { fps: 10, qrbox: { width: 250, height: 250 } },
            /* verbose= */ false
            );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>
</body>
</html>
