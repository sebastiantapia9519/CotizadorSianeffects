{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>📚 Mis Recetas (Productos)</h2>
        <button class="btn btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#modalReceta">
            + Nueva Receta
        </button>
    </div>

    <div class="row">
        {% for r in recetas %}
        <div class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-dark">{{ r.nombre }}</h5>
                    <p class="text-muted small">{{ r.num_materiales }} materiales</p>
                    <a href="{{ url_for('inventory.eliminar_receta', id=r.id) }}"
                        class="btn btn-outline-danger btn-sm rounded-pill w-100"
                        onclick="return confirm('¿Borrar esta receta?')">
                        Eliminar
                    </a>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center text-muted py-5">
            <p>No tienes recetas guardadas aún.</p>
        </div>
        {% endfor %}
    </div>
</div>

<!-- MODAL -->
<div class="modal fade" id="modalReceta" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">Crear Nueva Receta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nombre del Producto</label>
                    <input type="text" id="nombreReceta" class="form-control">
                </div>

                <hr>

                <h6 class="fw-bold">Materiales</h6>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <select id="selectMaterial" class="form-select">
                            <option value="">Selecciona material...</option>
                            {% for m in materiales %}
                            <option value="{{ m.id }}">{{ m.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-3">
                        <input type="number" id="cantidadMaterial" class="form-control" step="0.1">
                    </div>
                    <div class="col-3">
                        <button class="btn btn-secondary w-100" onclick="agregarFilaMaterial()">Agregar</button>
                    </div>
                </div>

                <table class="table table-sm" id="tablaMateriales">
                    <tbody></tbody>
                </table>

                <hr>

                <h6 class="fw-bold">Maquinaria</h6>
                <div class="input-group mb-2">
                    <select id="selectMaquinaria" class="form-select">
                        <option value="">Selecciona equipo...</option>
                        {% for eq in equipos %}
                        <option value="{{ eq.id }}">{{ eq.nombre }}</option>
                        {% endfor %}
                    </select>
                    <button class="btn btn-secondary" onclick="agregarFilaMaquinaria()">Agregar</button>
                </div>

                <table class="table table-sm" id="tablaMaquinaria">
                    <tbody></tbody>
                </table>
            </div>

            <div class="modal-footer border-0">
                <button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarReceta()">Guardar Receta</button>
            </div>
        </div>
    </div>
</div>

<script>
    let listaMateriales = [];
    let listaMaquinaria = [];

    function agregarFilaMaterial() {
        const sel = document.getElementById('selectMaterial');
        const cant = document.getElementById('cantidadMaterial').value;

        if (!sel.value || !cant) return alert('Completa material y cantidad');

        listaMateriales.push({
            id: sel.value,
            nombre: sel.options[sel.selectedIndex].text,
            cantidad: cant
        });

        renderMateriales();
        sel.value = '';
        document.getElementById('cantidadMaterial').value = '';
    }

    function renderMateriales() {
        const tbody = document.querySelector('#tablaMateriales tbody');
        tbody.innerHTML = '';
        listaMateriales.forEach((m, i) => {
            tbody.innerHTML += `
            <tr>
                <td>${m.nombre}</td>
                <td>${m.cantidad}</td>
                <td><button class="btn btn-sm btn-danger" onclick="borrarMat(${i})">x</button></td>
            </tr>`;
        });
    }

    function borrarMat(i) {
        listaMateriales.splice(i, 1);
        renderMateriales();
    }

    function agregarFilaMaquinaria() {
        const sel = document.getElementById('selectMaquinaria');
        if (!sel.value) return alert('Selecciona equipo');

        listaMaquinaria.push({
            id: sel.value,
            nombre: sel.options[sel.selectedIndex].text
        });

        renderMaquinaria();
        sel.value = '';
    }

    function renderMaquinaria() {
        const tbody = document.querySelector('#tablaMaquinaria tbody');
        tbody.innerHTML = '';
        listaMaquinaria.forEach((m, i) => {
            tbody.innerHTML += `
            <tr>
                <td>${m.nombre}</td>
                <td><button class="btn btn-sm btn-danger" onclick="borrarMaq(${i})">x</button></td>
            </tr>`;
        });
    }

    function borrarMaq(i) {
        listaMaquinaria.splice(i, 1);
        renderMaquinaria();
    }

    async function guardarReceta() {
        const nombre = document.getElementById('nombreReceta').value;
        if (!nombre || listaMateriales.length === 0)
            return alert('Nombre y al menos un material');

        const res = await fetch("{{ url_for('inventory.guardar_receta') }}", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                nombre,
                materiales: listaMateriales,
                maquinaria: listaMaquinaria
            })
        });

        const data = await res.json();
        if (data.success) location.reload();
        else alert(data.error || 'Error');
    }
</script>
{% endblock %}
