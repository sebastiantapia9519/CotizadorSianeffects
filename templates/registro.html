<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear Cuenta | SianEffects</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --sian-pink: #ff6b81;
            --sian-pink-light: #fff0f3;
            --sian-teal: #2ec4b6;
            --sian-teal-dark: #1f8c82;
            --bg-cream: #fffdf9;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-cream);
            color: #555;
            /* IMPORTANTE: Aquí quitamos el padding-top que causaba el espacio en blanco */
            padding-top: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hover-scale {
            transition: transform 0.2s;
        }

        .hover-scale:hover {
            transform: scale(1.02);
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }
    </style>
</head>

<body>

    <div class="container" style="max-width: 500px;">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div
            class="alert alert-{{ category }} shadow-sm rounded-4 border-0 mb-3 d-flex align-items-center alert-dismissible fade show">
            <i class="fas fa-info-circle me-2"></i> {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}
    </div>

    <div class="container d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 500px; width: 100%;">
            <div class="card-body p-5">

                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark mb-1">Crear Cuenta</h2>
                    <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3">
                        🚀 Prueba gratis por 7 días
                    </span>
                </div>

                <form action="{{ url_for('auth.registro') }}" method="POST">

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <div class="form-floating">
                                <input type="text" name="username" class="form-control rounded-3" id="userInput"
                                    placeholder="Usuario" required>
                                <label for="userInput">Usuario</label>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-floating">
                                <input type="text" name="company_name" class="form-control rounded-3" id="brandInput"
                                    placeholder="Tu Marca" required>
                                <label for="brandInput">Nombre de tu Marca</label>
                            </div>
                        </div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" name="email" class="form-control rounded-3" id="emailInput"
                            placeholder="nombre@ejemplo.com" required>
                        <label for="emailInput">Correo Electrónico</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="tel" name="phone" class="form-control rounded-3" id="phoneInput"
                            placeholder="Teléfono" pattern="[0-9]{10,15}" title="Solo números (mínimo 10 dígitos)">
                        <label for="phoneInput">Teléfono / WhatsApp (Opcional)</label>
                        <div class="form-text small ms-1">Solo dígitos, sin guiones.</div>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="password" name="password" class="form-control rounded-3" id="passInput"
                            placeholder="Contraseña" minlength="6" required>
                        <label for="passInput">Contraseña</label>
                        <div class="form-text small ms-1">Mínimo 6 caracteres.</div>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" name="confirm_password" class="form-control rounded-3" id="confirmInput"
                            placeholder="Confirmar" required>
                        <label for="confirmInput">Confirmar Contraseña</label>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label small text-muted" for="termsCheck">
                            Acepto los <a href="{{ url_for('main.terminos') }}"
                                class="text-primary text-decoration-none">Términos y Condiciones</a>.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm hover-scale">
                        COMENZAR PRUEBA GRATIS 📝
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('auth.login') }}" class="text-muted text-decoration-none small">
                        ¿Ya tienes cuenta? <span class="text-primary fw-bold">Entrar</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
