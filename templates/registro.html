{% extends "layout.html" %}

{% block title %}Crear Cuenta | SianEffects{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 90vh;">
    <div class="card border-0 shadow-lg rounded-4 overflow-hidden" style="max-width: 500px; width: 100%;">

        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark mb-1">Crear Cuenta</h2>
                <span class="badge bg-success bg-opacity-10 text-success rounded-pill px-3">
                    🚀 Prueba gratis por 7 días
                </span>
            </div>

            <form action="{{ url_for('auth.registro') }}" method="POST" class="needs-validation">

                <div class="row g-3 mb-3">
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" name="username" class="form-control rounded-3" id="userInput"
                                placeholder="Usuario" required>
                            <label for="userInput">Usuario</label>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="form-floating">
                            <input type="text" name="company_name" class="form-control rounded-3" id="brandInput"
                                placeholder="Tu Marca" required>
                            <label for="brandInput">Nombre de tu Marca</label>
                        </div>
                    </div>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control rounded-3" id="emailInput"
                        placeholder="nombre@ejemplo.com" required>
                    <label for="emailInput">Correo Electrónico</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="tel" name="phone" class="form-control rounded-3" id="phoneInput" placeholder="Teléfono"
                        pattern="[0-9]{10,15}" title="Solo números (mínimo 10 dígitos)">
                    <label for="phoneInput">Teléfono / WhatsApp (Opcional)</label>
                    <div class="form-text small ms-1">Solo dígitos, sin guiones.</div>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control rounded-3" id="passInput"
                        placeholder="Contraseña" minlength="6" required>
                    <label for="passInput">Contraseña Segura</label>
                    <div class="form-text small ms-1">Mínimo 6 caracteres.</div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                    <label class="form-check-label small text-muted" for="termsCheck">
                        Acepto los <a href="{{ url_for('main.terminos') }}"
                            class="text-primary text-decoration-none">Términos y Condiciones</a> y el uso de mis datos.
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm hover-scale">
                    COMENZAR PRUEBA GRATIS 🚀
                </button>

            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('auth.login') }}" class="text-muted text-decoration-none small">
                    ¿Ya tienes cuenta? <span class="text-primary fw-bold">Entrar</span>
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
    }

    .hover-scale {
        transition: transform 0.2s;
    }

    .hover-scale:hover {
        transform: scale(1.02);
    }
</style>
{% endblock %}
