<div class="card border-0 shadow-sm h-100 producto-card" data-tipo="{{ producto.tipo }}"
    data-src="{{ producto.archivo }}" onclick="openMedia(this)">

    {% if producto.tipo == 'imagen' %}
    <img src="{{ producto.archivo }}" class="card-img-top" loading="lazy">
    {% elif producto.tipo == 'video' %}
    <video class="w-100" muted preload="metadata">
        <source src="{{ producto.archivo }}">
    </video>
    {% elif producto.tipo == 'audio' %}
    <div class="p-4 text-center">
        🎧 Audio personalizado
    </div>
    {% endif %}

    <div class="card-body">
        <p class="mb-0 small fw-semibold">{{ producto.nombre }}</p>
    </div>
</div>
