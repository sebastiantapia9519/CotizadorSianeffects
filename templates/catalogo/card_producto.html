<div class="product-card h-100 shadow-sm border-0">

    {% if prod['media_type'] == 'image' %}
    <!-- IMAGE -->
    <div class="media-container">
        <div class="media-inner">
            <a href="{{ prod['media_url'] }}" class="glightbox">
                <img src="{{ prod['media_url'] }}" loading="lazy">
            </a>
        </div>
    </div>

    {% elif prod['media_type'] == 'video' %}
    <!-- VIDEO -->
    <div class="media-container">
        <div class="media-inner">
            <a href="{{ prod['media_url'] }}" class="glightbox">
                <video src="{{ prod['media_url'] }}" muted></video>
                <i class="fas fa-play-circle play-icon"></i>
            </a>
        </div>
    </div>

    {% elif prod['media_type'] == 'audio' %}
    <!-- AUDIO (SIN GLIGHTBOX) -->
    <div class="p-3 bg-light text-center">
        <i class="fas fa-music fa-2x text-primary mb-2"></i>

        <audio controls preload="none" class="w-100">
            <source src="{{ prod['media_url'] }}" type="audio/mpeg">
            Tu navegador no soporta audio.
        </audio>
    </div>
    {% endif %}

    <!-- INFO -->
    <div class="p-3 bg-white border-top">
        <div class="d-flex justify-content-between mb-1">
            <span class="badge bg-secondary">{{ prod['sku'] }}</span>
            {% if prod['precio'] > 0 %}
            <span class="fw-bold">${{ "%.0f"|format(prod['precio']) }}</span>
            {% endif %}
        </div>

        <h6 class="fw-bold mb-0 text-truncate">{{ prod['titulo'] }}</h6>
        <p class="text-muted small mb-0 text-truncate">{{ prod['descripcion'] }}</p>
    </div>

</div>
