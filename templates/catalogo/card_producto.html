<div class="product-card h-100">
    <div class="media-container" style="position: relative; padding-top: 100%; overflow: hidden; background: #f8f9fa;">


        <div
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">

            {% if prod['media_type'] == 'image' %}
            <a href="{{ prod['media_url'] }}" class="glightbox" data-gallery="galeria-general"
                data-title="{{ prod['titulo'] }}" data-description="SKU: {{ prod['sku'] }} - {{ prod['descripcion'] }}">
                <img src="{{ prod['media_url'] }}" loading="lazy" alt="{{ prod['titulo'] }}"
                    style="width: 100%; height: 100%; object-fit: cover; transition: 0.3s;">
            </a>

            {% elif prod['media_type'] == 'video' %}
            <a href="{{ prod['media_url'] }}" class="glightbox" data-gallery="galeria-general"
                data-title="{{ prod['titulo'] }}">
                <video src="{{ prod['media_url'] }}" style="width: 100%; height: 100%; object-fit: cover;"></video>
                <div
                    style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; opacity: 0.8;">
                    <i class="fas fa-play-circle fa-3x"></i>
                </div>
            </a>

            {% elif prod['media_type'] == 'audio' %}
            <div class="media-container d-flex align-items-center justify-content-center"
                style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #f8f9fa;">

                <div class="text-center w-100">
                    <audio id="audio-{{ prod['sku'] }}">
                        <source src="{{ prod['media_url'] }}" type="audio/mpeg">
                    </audio>

                    <button type="button" onclick="toggleAudio('{{ prod['sku'] }}')"
                        class="btn btn-primary rounded-circle d-inline-flex align-items-center justify-content-center shadow"
                        style="width: 60px; height: 60px; transition: 0.3s; border: none;">
                        <i class="fas fa-play fa-lg" id="icon-{{ prod['sku'] }}"></i>
                    </button>

                    <p class="small fw-bold mt-2 mb-0" style="color: var(--dark);">Escuchar Demo</p>
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <div class="p-3 bg-white border-top">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-secondary">{{ prod['sku'] }}</span>
            {% if prod['precio'] > 0 %}
            <span class="fw-bold text-dark">${{ "%.0f"|format(prod['precio']) }}</span>
            {% endif %}
        </div>
        <h6 class="fw-bold text-dark mb-1">{{ prod['titulo'] }}</h6>
        <p class="text-muted small mb-0 text-truncate">{{ prod['descripcion'] }}</p>
    </div>
</div>
