<div class="card h-100 card-producto border-0 shadow-sm">

    <div style="cursor: pointer; position: relative; overflow: hidden; height: 250px; background-color: #f8f9fa;"
        data-bs-toggle="modal" data-bs-target="#mediaModal" data-titulo="{{ producto.titulo }}"
        data-desc="{{ producto.descripcion }}" data-url="{{ producto.media_url }}" data-type="{{ producto.media_type }}"
        onclick="cargarModalMultimedia(this)">

        <span class="badge bg-white text-dark position-absolute top-0 start-0 m-2 shadow-sm border"
            style="font-size: 0.7rem; z-index: 2;">
            {% if producto.media_type == 'video' %}
            <i class="fas fa-video text-danger"></i> Video
            {% else %}
            <i class="fas fa-image text-primary"></i> Imagen
            {% endif %}
        </span>

        {% if producto.media_type == 'video' %}
        <video src="{{ producto.media_url }}" class="w-100 h-100" style="object-fit: cover;" muted loop
            onmouseover="this.play()" onmouseout="this.pause()"></video>

        <div class="position-absolute top-50 start-50 translate-middle text-white"
            style="pointer-events: none; opacity: 0.8;">
            <i class="fas fa-play-circle fa-3x"></i>
        </div>
        {% else %}
        <img src="{{ producto.media_url }}" class="card-img-top w-100 h-100" alt="{{ producto.titulo }}"
            style="object-fit: cover;">
        {% endif %}

    </div>

    <div class="card-body p-3 d-flex flex-column">

        <div style="cursor: pointer;" data-bs-toggle="modal" data-bs-target="#mediaModal"
            data-titulo="{{ producto.titulo }}" data-desc="{{ producto.descripcion }}"
            data-url="{{ producto.media_url }}" data-type="{{ producto.media_type }}"
            onclick="cargarModalMultimedia(this)">

            <h6 class="fw-bold text-dark mb-1 text-truncate">{{ producto.titulo }}</h6>
            <p class="text-muted small mb-2 text-truncate">{{ producto.descripcion }}</p>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small" style="font-size: 0.75rem;">
                    <i class="fas fa-tag me-1"></i> {{ producto.sku }}
                </span>
                <span class="fw-bold text-primary">${{ "%.2f"|format(producto.precio) }}</span>
            </div>
        </div>

        <div class="mt-auto">
            <button class="btn btn-sm btn-outline-dark w-100 btn-add-cart rounded-pill fw-bold"
                onclick="agregarAlCarrito(this, '{{ producto.id }}', '{{ producto.titulo }}', {{ producto.precio }})">
                <i class="fas fa-shopping-bag me-1"></i> AGREGAR
            </button>
        </div>

    </div>
</div>
