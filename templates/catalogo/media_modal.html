<div class="modal fade" id="mediaModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg" style="background-color: #1a1a1a; color: white;">

            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title fw-bold" id="modalTitulo"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body p-0 text-center d-flex align-items-center justify-content-center position-relative"
                style="min-height: 400px; background-color: #000;" id="mediaContainer">
            </div>

            <div class="modal-footer border-top border-secondary justify-content-start">
                <p id="modalDesc" class="text-white-50 m-0 small"></p>
            </div>

        </div>
    </div>
</div>

<script>
    let mediaModalObj;

    document.addEventListener('DOMContentLoaded', function () {
        const modalEl = document.getElementById('mediaModal');
        mediaModalObj = new bootstrap.Modal(modalEl);

        modalEl.addEventListener('hidden.bs.modal', function () {
            document.getElementById('mediaContainer').innerHTML = '';
        });
    });

    function openMedia(el) {
        // Obtenemos los datos y limpiamos espacios o mayúsculas
        let tipo = (el.dataset.tipo || '').toLowerCase().trim();
        const src = el.dataset.src;
        const titulo = el.dataset.titulo;
        const desc = el.dataset.desc;

        const container = document.getElementById('mediaContainer');
        document.getElementById('modalTitulo').textContent = titulo || 'Detalle';
        document.getElementById('modalDesc').textContent = desc || '';

        container.innerHTML = '<div class="spinner-border text-light" role="status"></div>';

        setTimeout(() => {
            // CORRECCIÓN AQUÍ: Aceptamos 'imagen' O 'image'
            if (tipo === 'imagen' || tipo === 'image') {
                container.innerHTML = `
                    <img src="${src}" class="img-fluid" style="max-height: 80vh;" 
                         onerror="this.parent.innerHTML='<p>Error al cargar imagen</p>'">`;
            }
            else if (tipo === 'video') {
                container.innerHTML = `
                    <video controls autoplay class="w-100" style="max-height: 80vh;">
                        <source src="${src}">
                        Tu navegador no soporta video.
                    </video>`;
            }
            else if (tipo === 'audio') {
                container.innerHTML = `
                    <div class="p-5 text-center">
                        <div class="mb-4 rounded-circle bg-dark d-inline-block p-4 border border-secondary">
                            <i class="fas fa-music fa-4x text-info"></i>
                        </div>
                        <h4 class="mb-4">Reproduciendo Audio</h4>
                        <audio controls autoplay class="w-100">
                            <source src="${src}">
                        </audio>
                    </div>`;
            } else {
                // Esto es lo que estabas viendo, ahora ya no debería salir
                container.innerHTML = '<p class="text-danger">Formato no reconocido (' + tipo + ')</p>';
            }
            mediaModalObj.show();
        }, 100);
    }
</script>
